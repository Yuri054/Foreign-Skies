[package]
name = "fs_sim"
version = "0.1.0"
edition = "2021"
description = "Foreign Skies simulation, ported from scripts/sim (GDScript) to Rust, checked against the original's own output"
publish = false

[dependencies]
ciborium = "0.2.2"
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

